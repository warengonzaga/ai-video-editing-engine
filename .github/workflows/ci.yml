name: CI

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to validate (all runs the complete matrix)
        type: choice
        required: true
        default: all
        options:
          - all
          - linux
          - macos
          - windows

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'all' && '["ubuntu-latest","macos-latest","windows-latest"]' || inputs.platform == 'linux' && '["ubuntu-latest"]' || inputs.platform == 'macos' && '["macos-latest"]' || '["windows-latest"]') }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress

      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install optional OTIO adapter for interchange coverage
        run: python -m pip install -r requirements-otio.txt

      - name: Install HyperFrames browser
        run: bun node_modules/hyperframes/bin/hyperframes.mjs browser ensure

      - name: Check formatting and lint
        run: bun run check

      - name: Run tests
        run: bun test

      - name: Render Engine integration smoke
        run: bun run test:render-smoke

      - name: Upload failed render smoke workspace for diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: render-smoke-debug-${{ runner.os }}
          path: ${{ runner.temp }}/aive-render-smoke-*/video-projects
          if-no-files-found: ignore
          retention-days: 3

      - name: Audit production dependencies
        run: bun audit --omit=dev
