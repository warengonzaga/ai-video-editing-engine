name: Build Flow

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-flow:
    uses: wgtechlabs/build-flow-action/.github/workflows/app.yml@v1.0.1
    with:
      ci-profile: node
      ci-runtime-version: '22'
      enable-package: true
      enable-container: false
      enable-release: true
      enable-gitleaks: false
      enable-codeql: false
      package-registry: both
      package-npm-auth-method: oidc
      package-scope: '@warengonzaga'
      package-access: public
      package-pr-comment-enabled: false
      publish-dev-artifacts: false
      publish-pr-artifacts: false
      publish-manual-artifacts: false
      release-initial-version: '0.1.0'
      release-git-user-name: Waren Gonzaga
      release-git-user-email: opensource@warengonzaga.com
